[package]
name = "tank_maze"
version = "0.1.0"
edition = "2021"

[dependencies]
ggez = "0.9"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
bincode = "1.3"
tokio = { version = "1", features = ["full"] }
iroh = "0.28"
futures = "0.3"
arboard = "3.4"  # For clipboard support

# Note: The deprecation warnings are because iroh internals use iroh-net
# These are harmless and will go away in future iroh versions